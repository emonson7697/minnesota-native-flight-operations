<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Minnesota Native Air</title>
  <meta name="description" content="Request and follow private company flights with Minnesota Native Air.">
  <meta property="og:title" content="Minnesota Native Air">
  <meta property="og:description" content="A clear, comfortable way to request your next company flight.">
  <meta property="og:image" content="https://emonson7697.github.io/minnesota-native-flight-operations/public/og.png">
  <link rel="icon" href="public/favicon.svg">
  <link rel="stylesheet" href="premium.css">
</head>
<body>
<header class="site-header">
  <button class="wordmark" onclick="showHome()" aria-label="Minnesota Native Air home">
    <span class="mark">MN</span><span><strong>Minnesota Native</strong><small>Air</small></span>
  </button>
  <nav class="top-nav" aria-label="Primary">
    <button data-view="home" class="active" onclick="showHome()">My trips</button>
    <button data-view="request" onclick="startRequest()">Flight Request</button>
    <button data-view="ops" onclick="showOps()">Operations</button>
  </nav>
  <button class="profile" aria-label="Profile for Joe Schafer">JS</button>
</header>

<main id="app"></main>

<nav class="mobile-nav" aria-label="Mobile navigation">
  <button data-mobile="home" class="active" onclick="showHome()"><span>⌂</span>Trips</button>
  <button data-mobile="request" onclick="startRequest()"><span>＋</span>Request</button>
  <button data-mobile="ops" onclick="showOps()"><span>◫</span>Operations</button>
</nav>
<div id="toast" class="toast" role="status" hidden></div>

<script>
const fleet=[
  {id:'N172MN',type:'Cessna 172S',name:'North Star',seats:3,range:'Regional',accent:'pine'},
  {id:'N612ML',type:'Cessna 172S',name:'Lakes Country',seats:3,range:'Regional',accent:'sky'},
  {id:'N208MN',type:'Kodiak 100',name:'Timberwolf',seats:8,range:'Long-range',accent:'pine'},
  {id:'N839RM',type:'Robinson R44',name:'Canopy',seats:3,range:'Local',accent:'sand'}
];
const profiles=[
  {id:'joe',name:'Joe Schafer',weight:185,detail:'You · fleet owner',selected:true},
  {id:'leah',name:'Leah M.',weight:142,detail:'Frequent traveler',selected:true},
  {id:'jordan',name:'Jordan T.',weight:176,detail:'Frequent traveler',selected:false}
];
let state={step:1,requester:'joe',tripType:'round',departTbd:false,returnLabel:'Return to Brainerd',stops:[],departure:'Brainerd Regional (KBRD)',arrival:'Austin-Bergstrom (KAUS)',departureKind:'airport',arrivalKind:'airport',departureCode:'KBRD',arrivalCode:'KAUS',departurePin:0,arrivalPin:1,privateSite:false,departDate:'2026-08-24',departTime:'08:00',returnDate:'2026-08-27',returnTime:'15:30',aircraft:'N208MN',gear:90,preferredPilot:'No preference',passengerForm:false,submitted:false,opsLegs:[{label:'Outbound',route:'KBRD → KAUS',date:'2026-08-24',time:'08:10',arrival:'10:58'},{label:'Return',route:'KAUS → KBRD',date:'2026-08-27',time:'15:30',arrival:'18:18'}]};

function setView(view){document.querySelectorAll('[data-view],[data-mobile]').forEach(b=>b.classList.toggle('active',(b.dataset.view||b.dataset.mobile)===view));window.scrollTo(0,0)}
function toast(message){const t=document.getElementById('toast');t.textContent='✓ '+message;t.hidden=false;setTimeout(()=>t.hidden=true,2600)}
function formatDate(value){if(!value)return 'To be decided';return new Date(value+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function available(a){if(a.id==='N839RM'&&state.departDate<='2026-08-25')return {ok:false,label:'Maintenance through Aug 25'};if(a.id==='N612ML'&&state.departDate==='2026-08-24')return {ok:false,label:'Returns at 4:30 PM'};return {ok:true,label:'Available for your dates'}}
function placeData(which){if(which.startsWith('stop'))return state.stops[Number(which.slice(4))];return {value:state[which],kind:state[which+'Kind'],code:state[which+'Code'],pin:state[which+'Pin']}}
function needsLandingApproval(){return [placeData('departure'),placeData('arrival'),...state.stops].some(p=>p.kind==='private')}
function placeLabel(which){const p=placeData(which);return p.kind==='airport'?(p.code||p.value):p.value}
function routeLabel(){return itineraryPlaces().map(p=>p.kind==='airport'?(p.code||p.value):p.value).join(' → ')}
function setPlace(which,value,kind,code=''){if(which.startsWith('stop'))Object.assign(state.stops[Number(which.slice(4))],{value,kind,code});else{state[which]=value;state[which+'Kind']=kind;state[which+'Code']=code}state.privateSite=needsLandingApproval();renderRequest()}
function editPlace(which,value){const match=value.toUpperCase().match(/\b(KBRD|KAUS|KDAL|KBJI)\b/);const kind=match?'airport':'pending',code=match?match[1]:'';if(which.startsWith('stop'))Object.assign(state.stops[Number(which.slice(4))],{value,kind,code});else{state[which]=value;state[which+'Kind']=kind;state[which+'Code']=code}state.privateSite=needsLandingApproval()}
function mapPoint(p){const key=((p.code||'')+' '+(p.value||'')).toUpperCase();if(key.includes('KBRD')||key.includes('BRAINERD'))return {lat:46.3983,lon:-94.1381,span:.18,label:'Brainerd Regional Airport'};if(key.includes('KAUS')||key.includes('AUSTIN'))return {lat:30.1975,lon:-97.6664,span:.18,label:'Austin-Bergstrom International Airport'};if(key.includes('DULUTH'))return {lat:46.8421,lon:-92.1936,span:.2,label:'Duluth, Minnesota'};if(key.includes('MOORHEAD')||key.includes('RED RIVER'))return {lat:46.8738,lon:-96.7678,span:.12,label:'Red River restoration site'};return {lat:46.3,lon:-94.2,span:2.7,label:p.value||'Minnesota'} }
function mapEmbed(p){const m=mapPoint(p),box=[m.lon-m.span,m.lat-m.span*.65,m.lon+m.span,m.lat+m.span*.65].map(n=>n.toFixed(5)).join('%2C');return `https://www.openstreetmap.org/export/embed.html?bbox=${box}&layer=mapnik&marker=${m.lat.toFixed(5)}%2C${m.lon.toFixed(5)}`}
function mapLink(p){const m=mapPoint(p);return `https://www.openstreetmap.org/?mlat=${m.lat.toFixed(5)}&mlon=${m.lon.toFixed(5)}#map=13/${m.lat.toFixed(5)}/${m.lon.toFixed(5)}`}
function adjustPin(which){if(which.startsWith('stop')){const p=state.stops[Number(which.slice(4))];p.pin=(p.pin+1)%3}else state[which+'Pin']=(state[which+'Pin']+1)%3;renderRequest();toast('Demo pin adjusted')}
function setTripType(type){state.tripType=type;if(type==='multi'&&state.stops.length===0)state.stops.push({value:'Duluth, MN',kind:'city',code:'',pin:2,date:'2026-08-26'});renderRequest()}
function addRouteStop(){state.tripType='multi';state.stops.push({value:'Duluth, MN',kind:'city',code:'',pin:state.stops.length%3,date:state.returnDate});renderRequest();toast('Stop added')}
function removeRouteStop(index){state.stops.splice(index,1);state.privateSite=needsLandingApproval();renderRequest()}
function updateStopSchedule(index,field,value){state.stops[index][field]=value}
function itineraryPlaces(){const places=[placeData('departure'),placeData('arrival'),...(state.tripType==='multi'?state.stops:[])];if(state.tripType==='round')places.push(placeData('departure'));return places}
function itineraryMarkup(){const places=itineraryPlaces();return places.slice(0,-1).map((from,i)=>{const to=places[i+1];const isReturn=state.tripType==='round'&&i===places.length-2;const stop=state.tripType==='multi'&&i>0?state.stops[i-1]:null;const date=isReturn?formatDate(state.returnDate):stop?formatDate(stop.date):formatDate(state.departDate);const time=i===0?(state.departTbd?'Departure time TBD':state.departTime):'Time set by operations';return `<div class="itinerary-leg"><i>${i+1}</i><div><small>${i===0?'Outbound':isReturn?'Return':'Leg '+(i+1)}</small><strong>${from.value||'Choose origin'} → ${to.value||'Choose destination'}</strong></div><span>${date} · ${time}</span></div>`}).join('')}
function placeCard(which,title,removable=false){const p=placeData(which);const airport=p.kind==='airport',city=p.kind==='city';const stopIndex=removable?Number(which.slice(4)):-1;return `<div class="place-card"><div class="place-card-head"><label><span>${title}</span><input value="${p.value}" aria-label="${title}" placeholder="Airport, city, address, or landing site" oninput="editPlace('${which}',this.value)" onchange="renderRequest()"></label>${removable?`<button class="remove-place" onclick="removeRouteStop(${stopIndex})" aria-label="Remove ${title}">×</button>`:''}</div><div class="place-suggestions"><button onclick="setPlace('${which}','Brainerd Regional (KBRD)','airport','KBRD')">KBRD</button><button onclick="setPlace('${which}','Austin-Bergstrom (KAUS)','airport','KAUS')">KAUS</button><button onclick="setPlace('${which}','Duluth, MN','city')">Duluth</button><button onclick="setPlace('${which}','Red River restoration site, Moorhead MN','private')">Private site</button></div><div class="map-preview"><iframe title="${title} map for ${mapPoint(p).label}" src="${mapEmbed(p)}" loading="lazy"></iframe><span class="map-badge">Interactive map</span></div><div class="map-caption"><span>${airport?`Airport · ${p.code}`:city?'Nearest airport set by operations':p.kind==='private'?'Landing approval required':'Location review required'}</span><a href="${mapLink(p)}" target="_blank" rel="noopener">Larger map ↗</a></div></div>`}

function showHome(){setView('home');document.getElementById('app').innerHTML=`
  <section class="home-shell">
    <section class="customer-hero" aria-label="Minnesota Native Air">
      <img src="public/og.png" alt="Minnesota lakes, native grasses, and a small aircraft in flight">
      <div class="hero-action">
        <div><p class="eyebrow">Welcome, Joe</p><p>Choose your route, dates, and travelers.</p></div>
        <button class="primary large" onclick="startRequest()">Flight Request <span>→</span></button>
      </div>
    </section>
    <section class="current-trip">
      <div class="trip-top"><div><p class="eyebrow">Upcoming request · MN-1048</p><span class="status-pill">Pilot assigned</span></div><button class="text-button" onclick="showStatus(true)">View details →</button></div>
      <div class="route-line"><div><strong>KBRD</strong><span>Brainerd</span></div><div class="route-path"><i></i><span>✈</span><i></i><small>2 hr 48 min</small></div><div class="align-right"><strong>KAUS</strong><span>Austin</span></div></div>
      <div class="trip-summary"><div><small>Depart</small><strong>Mon, Aug 24 · 8:00 AM</strong></div><div><small>Return</small><strong>Thu, Aug 27 · 3:30 PM</strong></div><div><small>Aircraft</small><strong>Kodiak · Timberwolf</strong></div><div class="pilot-chip"><span>MJ</span><p><small>Your pilot</small><strong>Mara Jensen</strong></p></div></div>
      <div class="readiness-strip"><div class="ready"><i>✓</i><p><small>Aircraft</small><strong>Kodiak available</strong></p></div><div class="ready"><i>✓</i><p><small>Pilot</small><strong>Mara confirmed</strong></p></div><div class="pending"><i>3</i><p><small>Landing zone</small><strong>Approval pending</strong></p></div></div>
    </section>
    <p class="support-copy">Plans change? Your operations team is here to help. <button onclick="toast('Operations notified')">Contact operations</button></p>
  </section>`}

function startRequest(){state.step=1;state.submitted=false;renderRequest()}
function renderRequest(){setView('request');if(state.submitted)return renderConfirmation();const labels=['Where','When','How'];const reviewing=state.step===4;document.getElementById('app').innerHTML=`
  <section class="request-shell type-${state.tripType} step-${state.step}">
    <div class="journey-masthead"><div class="request-head"><button class="back-link" onclick="showHome()">← My trips</button><p class="eyebrow">${reviewing?'Review':`Step ${state.step} of 3`}</p><h1>${['Where?','When?','How?','Review'][state.step-1]}</h1></div></div>
    <div class="step-bar">${labels.map((l,i)=>`<span class="${state.step>i?'active':''}${state.step===i+1?' current':''}"><i>${state.step>i+1?'✓':i+1}</i><b>${l}</b></span>`).join('')}</div>
    <section class="request-card">${state.step===1?whereStep():state.step===2?whenStep():state.step===3?aircraftStep():reviewStep()}<div class="form-actions"><button class="secondary" onclick="previous()">${state.step===1?'Save for later':'Back'}</button><button class="primary" onclick="next()">${state.step===4?'Send request':state.step===3?'Review':'Continue'} <span>→</span></button></div></section>
  </section>`}

function whereStep(){return `<div class="requester-line"><span>Requested by</span><select onchange="state.requester=this.value;renderRequest()"><option value="joe" ${state.requester==='joe'?'selected':''}>Joe Schafer · Owner</option><option value="leah" ${state.requester==='leah'?'selected':''}>Leah M. · Team member</option><option value="jordan" ${state.requester==='jordan'?'selected':''}>Jordan T. · Team member</option></select><small>${state.requester==='joe'?'Owner approved':'Needs Joe’s approval'}</small></div><div class="trip-type-first"><p class="eyebrow">Trip type</p><div class="segmented airline-tabs"><button class="${state.tripType==='round'?'active':''}" onclick="setTripType('round')">Round trip</button><button class="${state.tripType==='oneway'?'active':''}" onclick="setTripType('oneway')">One way</button><button class="${state.tripType==='multi'?'active':''}" onclick="setTripType('multi')">Multi-city</button></div></div><div class="place-grid">${placeCard('departure','From')}${placeCard('arrival','To')}${state.tripType==='multi'?state.stops.map((_,i)=>placeCard('stop'+i,'Stop '+(i+1),true)).join(''):''}</div>${state.tripType==='multi'?`<button class="route-add-stop" onclick="addRouteStop()">＋ Add stop</button>`:''}`}

function whenStep(){return `<div class="date-grid customer-timing"><label><span>Depart date</span><input type="date" value="${state.departDate}" onchange="state.departDate=this.value;renderRequest()"></label><div class="departure-time-field"><label><span>Departure time</span><input type="time" value="${state.departTime}" ${state.departTbd?'disabled':''} onchange="state.departTime=this.value"></label><label class="departure-tbd"><input type="checkbox" ${state.departTbd?'checked':''} onchange="state.departTbd=this.checked;renderRequest()"> Time TBD</label></div>${state.tripType==='round'?`<label><span>Return date</span><input type="date" value="${state.returnDate}" onchange="state.returnDate=this.value;renderRequest()"></label><label class="return-label"><span>Return to</span><input value="${state.returnLabel}" onchange="state.returnLabel=this.value" placeholder="Brainerd"></label>`:''}</div>${state.tripType==='multi'&&state.stops.length?`<div class="stop-dates"><p class="eyebrow">Stop dates</p>${state.stops.map((p,i)=>`<label><span>${p.value}</span><input type="date" value="${p.date||state.returnDate}" onchange="updateStopSchedule(${i},'date',this.value)"></label>`).join('')}</div>`:''}`}

function aircraftStep(){return `<div class="availability-head"><div><p class="eyebrow">Available for your dates</p><h2>Choose an aircraft</h2></div><button class="text-button" onclick="state.step=2;renderRequest()">Edit dates</button></div><div class="aircraft-list">${fleet.map(a=>{const av=available(a);return `<button class="aircraft-choice ${state.aircraft===a.id?'selected':''} ${av.ok?'':'unavailable'}" ${av.ok?'':'disabled'} onclick="state.aircraft='${a.id}';renderRequest()"><span class="aircraft-art ${a.accent}">${a.type.includes('R44')?'✣':a.type.includes('Kodiak')?'➤':'✈'}</span><div><p class="eyebrow">${a.type} · ${a.id}</p><h3>${a.name}</h3><span>${a.seats} passengers · ${a.range}</span></div><p class="availability ${av.ok?'yes':'no'}"><i></i>${av.label}</p><b>${state.aircraft===a.id?'✓':''}</b></button>`}).join('')}</div>`}

function travelerStep(){return `<div class="profile-list">${profiles.map(p=>`<button class="profile-row ${p.selected?'selected':''}" onclick="toggleProfile('${p.id}')"><span class="passenger-avatar">${p.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</span><p><strong>${p.name}</strong><small>${p.detail}</small></p><span class="weight"><small>Weight</small><strong>${p.weight} lb</strong></span><i>${p.selected?'✓':''}</i></button>`).join('')}</div>${state.passengerForm?`<div class="passenger-entry" role="group" aria-label="Add passenger"><div><p class="eyebrow">New passenger</p><h3>Name and weight</h3></div><div class="passenger-entry-fields"><label><span>Name</span><input id="new-passenger-name" autocomplete="name" placeholder="Passenger name"></label><label><span>Weight</span><div class="with-unit"><input id="new-passenger-weight" type="number" inputmode="numeric" min="1" placeholder="170"><b>lb</b></div></label></div><div class="passenger-entry-actions"><button class="text-button" onclick="cancelTraveler()">Cancel</button><button class="primary" onclick="saveTraveler()">OK</button></div></div>`:`<button class="add-person" onclick="addTraveler()">＋ Add passenger</button>`}<div class="manifest-fields"><label><span>Gear weight</span><div class="with-unit"><input type="number" value="${state.gear}" oninput="state.gear=this.value" onchange="renderRequest()"><b>lb</b></div></label><label><span>Preferred pilot <em>Optional</em></span><select onchange="state.preferredPilot=this.value"><option ${state.preferredPilot==='No preference'?'selected':''}>No preference</option><option ${state.preferredPilot==='Mara Jensen'?'selected':''}>Mara Jensen</option><option ${state.preferredPilot==='Eli Redbird'?'selected':''}>Eli Redbird</option></select></label></div>`}

function reviewStep(){const chosen=fleet.find(a=>a.id===state.aircraft);const travelers=profiles.filter(p=>p.selected);const total=travelers.reduce((sum,p)=>sum+p.weight,0);const route=itineraryPlaces().map(p=>p.code||p.value).join(' → ');const requester=state.requester==='joe'?'Joe Schafer':state.requester==='leah'?'Leah M.':'Jordan T.';return `<div class="review-hero"><span class="aircraft-art pine">${chosen.type.includes('R44')?'✣':chosen.type.includes('Kodiak')?'➤':'✈'}</span><div><p class="eyebrow">Itinerary</p><h2>${route}</h2><p>${chosen.type} · ${chosen.name}</p></div><button class="text-button" onclick="state.step=1;renderRequest()">Edit route</button></div><div class="review-itinerary"><p class="eyebrow">Flight plan</p>${itineraryMarkup()}</div><div class="review-grid"><div><small>Requested by</small><strong>${requester}</strong><span>${state.requester==='joe'?'Owner approved':'Owner approval required'}</span></div><div><small>Trip type</small><strong>${state.tripType==='round'?'Round trip':state.tripType==='multi'?'Multi-city':'One way'}</strong><span>${itineraryPlaces().length-1} ${itineraryPlaces().length-1===1?'leg':'legs'}</span></div><div><small>Aircraft</small><strong>${chosen.name}</strong><span>${chosen.type} · ${chosen.id}</span></div><div><small>Travelers & gear</small><strong>${travelers.length} people · ${state.gear} lb</strong><span>${total} lb passenger weight</span></div></div>${needsLandingApproval()?`<div class="approval-review"><span>⌖</span><p><strong>Landing approval required</strong><small>Operations will confirm the site before the trip.</small></p></div>`:''}<section class="review-travelers"><div class="review-section-head"><div><p class="eyebrow">Travelers</p><h2>People and gear</h2></div><span>${travelers.length} selected</span></div>${travelerStep()}</section>`}

function toggleProfile(id){profiles.find(p=>p.id===id).selected=!profiles.find(p=>p.id===id).selected;renderRequest()}
function addStop(){addRouteStop()}
function addTraveler(){state.passengerForm=true;renderRequest();setTimeout(()=>document.getElementById('new-passenger-name')?.focus(),0)}
function cancelTraveler(){state.passengerForm=false;renderRequest()}
function saveTraveler(){const name=document.getElementById('new-passenger-name').value.trim();const weight=Number(document.getElementById('new-passenger-weight').value);if(!name){document.getElementById('new-passenger-name').focus();return toast('Enter a passenger name')}if(!weight||weight<1){document.getElementById('new-passenger-weight').focus();return toast('Enter passenger weight')}profiles.push({id:'p'+Date.now(),name,weight,detail:'Added passenger',selected:true});state.passengerForm=false;renderRequest();toast('Passenger added')}
function previous(){if(state.step===1){toast('Draft saved on this device');showHome()}else{state.step--;renderRequest()}}
function next(){if(state.step<4){state.step++;renderRequest()}else{state.submitted=true;renderRequest();toast('Request sent to operations')}}

function renderConfirmation(){const owner=state.requester==='joe';const requester=owner?'Joe Schafer':state.requester==='leah'?'Leah M.':'Jordan T.';document.getElementById('app').innerHTML=`<section class="confirmation-shell"><div class="confirmation-icon">✓</div><p class="eyebrow">Request MN-1052 · ${requester}</p><h1>${owner?'Request sent':'Awaiting Joe’s approval'}</h1><div class="confirmation-card"><div><small>Itinerary</small><strong>${itineraryPlaces().map(p=>p.code||p.value).join(' → ')}</strong><span>${formatDate(state.departDate)} · ${state.departTbd?'Time TBD':state.departTime} · ${state.tripType==='round'?formatDate(state.returnDate):'One way'}</span></div><button class="primary" onclick="showStatus(false)">View status →</button></div><button class="text-button" onclick="showHome()">My trips</button></section>`}

function showStatus(existing){setView('home');const site=existing||state.privateSite;const owner=existing||state.requester==='joe';document.getElementById('app').innerHTML=`<section class="status-shell"><button class="back-link" onclick="showHome()">← My trips</button><div class="status-head"><div><p class="eyebrow">Request ${existing?'MN-1048':'MN-1052'}</p><h1>${existing?'Two of three trip checks are ready.':owner?'Owner approval complete.':'Awaiting Joe’s approval.'}</h1><p>${existing?'Mara is assigned; landing-zone approval is still in progress.':owner?'Joe submitted this request, so operations can begin its review.':'Operations begins only after Joe approves this team request.'}</p></div><span class="status-pill">${existing?'Pilot assigned':owner?'Owner approved':'Requested'}</span></div><div class="status-route"><div><small>Route</small><strong>Brainerd → Austin</strong></div><div><small>Dates</small><strong>Aug 24 – Aug 27</strong></div><div><small>Aircraft requested</small><strong>Kodiak · Timberwolf</strong></div></div><div class="readiness-grid"><div class="${existing?'ready':'planning'}"><i>${existing?'✓':'1'}</i><p><small>Aircraft</small><strong>${existing?'Kodiak assigned':'Planning availability found'}</strong><span>${existing?'Confirmed by operations':'Not reserved or assigned yet'}</span></p></div><div class="${existing?'ready':'pending'}"><i>${existing?'✓':'2'}</i><p><small>Primary & backup pilots</small><strong>${existing?'Mara + backup confirmed':'Not yet confirmed'}</strong><span>${existing?'Assigned by operations':owner?'Operations review can begin':'Starts after Joe approves'}</span></p></div>${site?`<div class="pending"><i>3</i><p><small>Landing zone</small><strong>Not yet confirmed</strong><span>${owner?'Operations clearance pending':'Starts after Joe approves'}</span></p></div>`:''}</div>${existing?`<section class="pilot-advisory"><div class="pilot-advisory-head"><span class="pilot-badge">MJ</span><div><p class="eyebrow">Pilot trip review</p><h2>Mara Jensen · planning advisory</h2></div><b>Demo planning data</b></div><div class="advisory-grid"><div><small>Planned departure</small><strong>8:10 AM</strong><span>Outbound · KBRD</span></div><div><small>Predicted winds</small><strong>210° at 8 kt</strong><span>Illustrative, not a forecast</span></div><div><small>Airborne time</small><strong>1.5 hours</strong><span>Estimated first leg</span></div><div><small>Destination note</small><strong>Use KAUS Signature</strong><span>Private site remains pending</span></div></div></section>`:''}<div class="friendly-timeline"><div class="complete"><i>✓</i><p><strong>Requested</strong><small>Received ${existing?'Aug 16 at 10:42 AM':'just now'}</small></p></div><div class="${owner?'complete':'current'}"><i>${owner?'✓':'2'}</i><p><strong>Owner approval</strong><small>${existing?'Approved by Joe Schafer':owner?'Implicit · submitted by Joe Schafer':'Waiting for Joe Schafer'}</small></p></div><div class="${existing?'complete':owner?'current':''}"><i>${existing?'✓':'3'}</i><p><strong>${existing?'Pilots assigned':'Operations review'}</strong><small>${existing?'Mara Jensen primary · qualified backup confirmed':owner?'Confirming aircraft, primary pilot, and backup pilot':'Begins only after Joe approves'}</small></p>${existing?'<span class="pilot-badge">MJ</span>':''}</div>${site?`<div class="${existing?'current':''}"><i>4</i><p><strong>Landing approval</strong><small>${existing?'Operations contacted the site · awaiting approval':owner?'May complete before or after pilot assignment':'Begins only after Joe approves'}</small></p></div>`:''}<div><i>${site?'5':'4'}</i><p><strong>Confirmed</strong><small>All required checks are ready</small></p></div></div><aside class="status-help"><span>i</span><p><strong>${owner?'Operations is cleared to plan.':'Joe approval is the gate.'}</strong><small>${owner?'After owner approval, aircraft, pilot, backup pilot, and landing-zone confirmations may complete in different orders.':'No operational assignment or landing-zone work begins until Joe approves.'}</small></p><button onclick="toast('Operations notified')">Contact operations</button></aside></section>`}

function showOps(){setView('ops');document.getElementById('app').innerHTML=`<section class="ops-shell"><div class="ops-head"><div><p class="eyebrow">Back office · demo</p><h1>Aircraft availability</h1><p>Block existing schedules and maintenance, then open a trip for pilot planning.</p></div><button class="secondary" onclick="toast('Schedule block added')">＋ Block time</button></div><div class="calendar"><div class="calendar-head"><span>Aircraft</span>${['Mon 24','Tue 25','Wed 26','Thu 27','Fri 28'].map(d=>`<span>${d}</span>`).join('')}</div>${fleet.map((a,i)=>`<div class="calendar-row"><span><strong>${a.name}</strong><small>${a.id}</small></span>${[0,1,2,3,4].map(day=>{let cls='',txt='Available';if(a.id==='N208MN'&&day<4){cls='trip-block';txt=day===0?'MN-1048':'Austin trip'}if(a.id==='N839RM'&&day<2){cls='maint-block';txt='Maintenance'}if(a.id==='N612ML'&&day===0){cls='trip-block';txt='Until 4:30'}return `<button class="${cls}" onclick="${cls==='trip-block'&&a.id==='N208MN'?`showPilotTrip()`:`toast('${a.name}: ${txt}')`}">${txt}</button>`}).join('')}</div>`).join('')}</div><p class="ops-footnote">Demo scheduling only. Flight Schedule Pro remains a future operational source of truth and is not connected.</p></section>`}

function updateOpsLeg(index,field,value){state.opsLegs[index][field]=value;toast('Itinerary updated')}
function addOpsLeg(){state.opsLegs.splice(state.opsLegs.length-1,0,{label:'Additional leg',route:'KAUS → Private site',date:'2026-08-26',time:'09:00',arrival:'10:00'});showPilotTrip();toast('Itinerary leg added')}
function showPilotTrip(){document.getElementById('app').innerHTML=`<section class="pilot-trip"><button class="back-link" onclick="showOps()">← Aircraft availability</button><div class="pilot-trip-head"><div><p class="eyebrow">Pilot planning · MN-1048</p><h1>Brainerd → Austin</h1><p>Kodiak N208MN · Aug 24–27</p></div><span class="status-pill">Assigned to Mara</span></div><section class="ops-itinerary"><div class="ops-itinerary-head"><div><p class="eyebrow">Editable itinerary</p><h2>Departure and arrival plan</h2><p>Customer preferences become an operations-managed schedule.</p></div><button class="secondary" onclick="addOpsLeg()">＋ Add leg</button></div><div class="ops-leg-list">${state.opsLegs.map((leg,i)=>`<div class="ops-leg"><span>${i+1}</span><label><small>Leg</small><input value="${leg.label}" onchange="updateOpsLeg(${i},'label',this.value)"></label><label class="ops-route"><small>Route</small><input value="${leg.route}" onchange="updateOpsLeg(${i},'route',this.value)"></label><label><small>Date</small><input type="date" value="${leg.date}" onchange="updateOpsLeg(${i},'date',this.value)"></label><label><small>Departure</small><input type="time" value="${leg.time}" onchange="updateOpsLeg(${i},'time',this.value)"></label><label><small>Home / arrival</small><input type="time" value="${leg.arrival}" onchange="updateOpsLeg(${i},'arrival',this.value)"></label></div>`).join('')}</div></section><div class="pilot-columns"><section><h2>Passenger manifest</h2>${profiles.filter(p=>p.selected).map(p=>`<div class="pilot-person"><span>${p.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</span><p><strong>${p.name}</strong><small>${p.detail}</small></p><b>${p.weight} lb</b></div>`).join('')}<div class="manifest-total"><span>Passenger total</span><strong>${profiles.filter(p=>p.selected).reduce((a,p)=>a+p.weight,0)} lb</strong></div><div class="manifest-total"><span>Gear & baggage</span><strong>90 lb</strong></div></section><section><h2>Trip notes</h2><div class="pilot-fact"><small>Private site</small><strong>Red River restoration site</strong><span>Approval pending · operations contacting owner</span></div><div class="pilot-fact"><small>Ground transport</small><strong>Vehicle requested on arrival</strong></div><div class="pilot-fact"><small>Purpose</small><strong>Field leadership and project review</strong></div></section></div></section>`}

showStatus=function(existing){setView('home');const owner=existing||state.requester==='joe';const site=existing||needsLandingApproval();const pilots=existing;const ready=owner&&pilots&&!site;document.getElementById('app').innerHTML=`<section class="status-shell simple-status"><button class="back-link" onclick="showHome()">← My trips</button><div class="simple-status-head"><p class="eyebrow">Request ${existing?'MN-1048':'MN-1052'}</p><h1>Trip status</h1><p>${existing?'KBRD → KAUS':routeLabel()} · Aug 24–27 · Kodiak</p></div><div class="status-progress"><div class="status-check ${existing?'complete':'planning'}"><i>${existing?'✓':'1'}</i><p><strong>Aircraft</strong><small>${existing?'Kodiak assigned':'Available · not assigned'}</small></p></div><div class="status-check ${owner?'complete':'pending'}"><i>${owner?'✓':'2'}</i><p><strong>Owner approval</strong><small>${owner?'Complete':'Waiting for Joe Schafer'}</small></p></div><div class="status-check ${pilots?'complete':'pending'}"><i>${pilots?'✓':'3'}</i><p><strong>Primary &amp; backup pilots</strong><small>${pilots?'Mara Jensen · backup confirmed':'Pending'}</small></p></div>${site?`<div class="status-check pending"><i>4</i><p><strong>Landing zone</strong><small>Approval pending</small></p></div>`:''}</div><div class="trip-result ${ready?'complete':''}"><i>${ready?'✓':'○'}</i><p><strong>Trip confirmed</strong><small>${ready?'Ready':'Pending'}</small></p></div>${existing?`<section class="pilot-advisory"><div class="pilot-advisory-head"><span class="pilot-badge">MJ</span><div><p class="eyebrow">Pilot trip review</p><h2>Mara Jensen</h2></div><b>Demo planning data</b></div><div class="advisory-grid"><div><small>Departure</small><strong>8:10 AM</strong><span>KBRD</span></div><div><small>Winds</small><strong>210° at 8 kt</strong><span>Demo</span></div><div><small>Airborne</small><strong>1.5 hours</strong><span>Estimate</span></div><div><small>Destination</small><strong>KAUS Signature</strong><span>LZ pending</span></div></div></section>`:''}<button class="text-button status-contact" onclick="toast('Operations notified')">Contact operations</button></section>`}
const renderBaseConfirmation=renderConfirmation;
renderConfirmation=function(){renderBaseConfirmation();document.querySelector('.confirmation-card strong').textContent=itineraryPlaces().map(p=>p.code||p.value).join(' → ')}

showHome();
</script>
</body>
