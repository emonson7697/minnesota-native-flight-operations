<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minnesota Native Flight Operations</title><meta name="description" content="A private aircraft fleet management demo for Minnesota Native Landscape."><link rel="stylesheet" href="app/globals.css"></head>
<body><main>
<header class="topbar"><button class="brand" onclick="show('fleet')"><span class="brandMark">MN</span><span><strong>Minnesota Native</strong><small>Flight Operations</small></span></button><nav class="desktopNav"><button data-nav="fleet" class="active" onclick="show('fleet')">Fleet</button><button data-nav="request" onclick="show('request')">My requests</button><button data-nav="dispatch" onclick="show('dispatch')">Dispatch</button></nav><div class="topActions"><span>Demo data</span><button class="avatar">EM</button></div></header>
<div class="syncNote"><span>◎</span><p><strong>Designed for Flight Schedule Pro</strong> <em>When connected, scheduling and status will sync from your operational source of truth.</em></p><b>Future connection</b></div>
<div id="content"></div>
<nav class="mobileNav"><button data-mobile="fleet" class="active" onclick="show('fleet')"><span>⌂</span>Fleet</button><button data-mobile="request" onclick="show('request')"><span>＋</span>Request</button><button data-mobile="dispatch" onclick="show('dispatch')"><span>↗</span>Dispatch</button></nav><div id="toast" class="toast" hidden></div>
</main><script>
const aircraft=[['N172MN','Cessna 172S','North Star','Available','Brainerd · 4 seats','100-hour inspection','46 hr','green','✈'],['N612ML','Cessna 172S','Lakes Country','In flight','Returning 2:40 PM','Oil service','31 hr','blue','✈'],['N208MN','Kodiak 100','Timberwolf','Available','Bemidji · 10 seats','Phase inspection','18 hr','green','➤'],['N44MN','Robinson R44','Canopy','Maintenance','Expected Aug 20','50-hour inspection','Due now','sand','✣']];
const pilots=[['Mara Jensen','MJ','C172 · Kodiak','On duty','green'],['Eli Redbird','ER','C172 · R44','Available','blue'],['Nolan Chen','NC','C172','Reserve','sand']];
const requests=[['LM','Leah M.','KBRD → North Shore Nursery','Today · 1:30 PM','N612ML','In flight','blue'],['JT','Jordan T.','KBRD → Red Lake Project','Tomorrow · 7:00 AM','N208MN','Ready','green'],['AP','Avery P.','KBRD → Duluth','Aug 21 · 9:15 AM','Unassigned','Review','sand']];
let step=1,primary='Mara Jensen',permission=true;
const metric=(i,v,l,t)=>`<div><span class="metricIcon ${t}">${i}</span><p><strong>${v}</strong><small>${l}</small></p></div>`;
function shell(view,html){document.getElementById('content').innerHTML=html;document.querySelectorAll('[data-nav],[data-mobile]').forEach(b=>b.classList.toggle('active',(b.dataset.nav||b.dataset.mobile)===view));scrollTo(0,0)}
function show(view){if(view==='fleet') fleet();if(view==='request'){step=1;request()}if(view==='dispatch')dispatch()}
function fleet(){shell('fleet',`<div class="pageShell"><section class="hero"><div><p class="eyebrow">Tuesday, August 18</p><h1>Good morning, Eric.</h1><p>Your fleet is ready for today’s field work.</p></div><button class="primaryButton" onclick="show('request')">＋ Request a flight</button></section><section class="metrics">${metric('✈','3','Aircraft operational','green')}${metric('↗','2','Flights today','blue')}${metric('⌁','1','Maintenance alert','sand')}${metric('◷','12 / 18','Pilot days remaining','mint')}</section><div class="sectionHeading"><div><h2>Fleet status</h2><p>Live sample availability across your aircraft</p></div><span>● Updated just now</span></div><section class="aircraftGrid">${aircraft.map(a=>`<article class="aircraftCard"><div class="aircraftVisual ${a[7]}"><span class="tail">${a[0]}</span><span class="planeIcon">${a[8]}</span><span class="statusBadge ${a[7]}">● ${a[3]}</span></div><div class="aircraftBody"><p class="overline">${a[1]}</p><h3>${a[2]}</h3><p class="location">⌖ ${a[4]}</p><div class="maintenance"><span>◇</span><p><small>Next maintenance</small><strong>${a[5]}</strong></p><b class="${a[6]==='Due now'?'urgent':''}">${a[6]}</b></div></div></article>`).join('')}</section><section class="splitSection"><div class="panel"><div class="panelHead"><div><h2>Upcoming flights</h2><p>Next 7 days</p></div><button onclick="show('dispatch')">Open dispatch →</button></div>${requests.map(r=>`<div class="requestRow"><span class="initials ${r[6]}">${r[0]}</span><div><strong>${r[1]}</strong><small>${r[3]}</small></div><div class="route"><strong>${r[2]}</strong><small>${r[4]}</small></div><span class="miniStatus ${r[6]}">● ${r[5]}</span></div>`).join('')}</div><div class="panel pilotPanel"><div class="panelHead"><div><h2>Pilot bench</h2><p>Built-in coverage, every trip</p></div><span class="coverage">3 ready</span></div><p class="continuity">A qualified second pilot is kept in the loop on every assignment, so your plans keep moving when schedules change.</p><div class="pilotList">${pilots.map(p=>`<div><span class="initials ${p[4]}">${p[1]}</span><p><strong>${p[0]}</strong><small>${p[2]}</small></p><span class="dot ${p[4]}">● ${p[3]}</span></div>`).join('')}</div><div class="pilotDays"><div><span>◷</span><p><strong>Included pilot days</strong><small>August service plan</small></p><b>12 remaining</b></div><div class="progress"><i></i></div><small>6 of 18 days used</small></div></div></section></div>`)}
const head=(n,t,s)=>`<div class="formTitle"><span>${n}</span><div><h2>${t}</h2><p>${s}</p></div></div>`;
function request(){let body=step===1?`${head('01','Trip details','Tell us where and when.')}<div class="formGrid"><label>Departing from<select><option>Brainerd Regional (KBRD)</option><option>Bemidji Regional (KBJI)</option></select></label><label>Destination<input value="Red Lake project site"></label><label>Departure date<input type="date" value="2026-08-20"></label><label>Preferred time<input type="time" value="07:00"></label><label class="wide">Purpose of trip<textarea>Field leadership visit and native planting review</textarea></label></div>`:step===2?`${head('02','Passengers & gear','Help us choose the right aircraft.')}<div class="formGrid"><label>Number of travelers<select><option>1</option><option>2</option><option selected>3</option><option>4</option></select></label><label>Estimated gear weight<select><option>Under 50 lb</option><option selected>Under 100 lb</option><option>100–250 lb</option></select></label><label class="wide">Traveler names<input value="Eric Monson, Leah M., Jordan T."></label><label class="wide check"><input type="checkbox" checked> I’ll need transportation from the landing site</label></div>`:`${head('03','Review request','Operations will confirm the final plan.')}<div class="reviewBlock"><div><small>Route</small><strong>Brainerd → Red Lake project site</strong></div><div><small>Departure</small><strong>Thu, Aug 20 · 7:00 AM</strong></div><div><small>Travelers</small><strong>3 people · under 100 lb gear</strong></div><div><small>Purpose</small><strong>Field leadership visit</strong></div></div><div class="infoBox">ℹ Aircraft and pilot appear after operations confirms qualification, availability, and landing permission.</div>`;shell('request',`<div class="pageShell narrow"><section class="requestIntro"><p class="eyebrow">Employee flight request</p><h1>Where does the work take you?</h1><p>Share the trip basics. Operations will handle the aircraft, pilot, and landing details.</p></section><div class="stepper"><span class="on">1<b>Trip</b></span><i class="${step>=2?'on':''}"></i><span class="${step>=2?'on':''}">2<b>Passengers</b></span><i class="${step>=3?'on':''}"></i><span class="${step>=3?'on':''}">3<b>Review</b></span></div><section class="formCard">${body}<div class="formActions"><button class="secondaryButton" ${step===1?'disabled':''} onclick="step--;request()">Back</button><button class="primaryButton" onclick="nextRequest()">${step<3?'Continue':'Submit request'} →</button></div></section></div>`)}
function nextRequest(){if(step<3){step++;request()}else{shell('request',`<div class="pageShell narrow"><section class="successCard"><span class="successIcon">✓</span><p class="eyebrow">Request MN-1048</p><h1>Flight request received</h1><p>Operations will confirm the aircraft, qualified pilot, and landing-site permission. You’ll see every update here.</p><div class="timeline"><div class="done"><i>✓</i><p><strong>Request submitted</strong><small>Today, 10:42 AM</small></p></div><div class="current"><i>2</i><p><strong>Operations review</strong><small>Aircraft, pilot, and site checks</small></p></div><div><i>3</i><p><strong>Flight confirmed</strong><small>You’ll be notified when ready</small></p></div></div><button class="secondaryButton" onclick="step=1;request()">Create another request</button></section></div>`);toast('Request submitted')}}
const num=(n,t,s)=>`<div class="numberedHead"><span>${n}</span><div><h2>${t}</h2><p>${s}</p></div>${n==='1'?'<b>Recommended</b>':''}</div>`;
function dispatch(){shell('dispatch',`<div class="pageShell"><section class="hero compact"><div><p class="eyebrow">Operations workspace</p><h1>Dispatch review</h1><p>Confirm the people, aircraft, and place before release.</p></div><span class="opsBadge">Operations view</span></section><section class="dispatchLayout"><div class="dispatchMain"><article class="panel dispatchRequest"><div class="dispatchTitle"><div><span class="miniStatus sand">● Needs review</span><h2>Brainerd → Red Lake project site</h2><p>Request MN-1048 · Eric Monson</p></div><div class="dateTile"><strong>20</strong><small>AUG</small></div></div><div class="tripFacts"><span><small>Departure</small><strong>7:00 AM</strong></span><span><small>Travelers</small><strong>3 people</strong></span><span><small>Gear</small><strong>&lt; 100 lb</strong></span><span><small>Return</small><strong>Same day</strong></span></div></article><article class="panel assignment">${num('1','Aircraft assignment','Matched to mission requirements')}<div class="choiceCard"><span class="choiceIcon">➤</span><div><p class="overline">KODIAK 100 · N208MN</p><h3>Timberwolf</h3><small>Best fit for passengers, gear, and remote-site access</small></div><span class="checkRound">✓</span></div></article><article class="panel assignment">${num('2','Qualified pilot','Select primary assignment')}<div class="pilotChoices">${pilots.slice(0,2).map(p=>`<button class="${primary===p[0]?'selected':''}" onclick="primary='${p[0]}';dispatch()"><span class="initials ${p[4]}">${p[1]}</span><p><strong>${p[0]}</strong><small>${p[2]}</small></p><i>${primary===p[0]?'✓':''}</i></button>`).join('')}</div><div class="benchNote"><span>↻</span><p><strong>Continuity covered</strong><small>${primary==='Mara Jensen'?'Eli Redbird':'Mara Jensen'} is briefed as the qualified backup pilot.</small></p></div></article><article class="panel assignment">${num('3','Landing-site permission','Required before dispatch')}<button class="permission ${permission?'approved':''}" onclick="permission=!permission;dispatch()"><span>${permission?'✓':'!'}</span><p><strong>${permission?'Permission verified':'Permission required'}</strong><small>Red Lake project site · Landowner confirmation on file</small></p><b>${permission?'Approved':'Review'}</b></button></article></div><aside class="releaseCard"><p class="eyebrow">Release checklist</p><h2>Ready to confirm</h2><div class="releaseList"><p><span>✓</span> Request reviewed</p><p><span>✓</span> Aircraft available</p><p><span>✓</span> Pilot qualified</p><p class="${permission?'':'pending'}"><span>${permission?'✓':'!'}</span> Landing permission</p></div><div class="weather"><span>☀</span><p><strong>Weather outlook</strong><small>VFR · 72° · light winds</small></p></div><button class="primaryButton full" ${permission?'':'disabled'} onclick="toast('Flight MN-1048 confirmed')">Confirm & release flight</button><small class="disclaimer">Demo only. Final operational release remains with the operator and its approved systems.</small></aside></section></div>`)}
function toast(s){let t=document.getElementById('toast');t.textContent='✓ '+s;t.hidden=false;setTimeout(()=>t.hidden=true,2400)}fleet();
</script></body></html>
