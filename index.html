<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Minnesota Native Air</title>
  <meta name="description" content="Request and follow private company flights with Minnesota Native Air.">
  <meta property="og:title" content="Minnesota Native Air">
  <meta property="og:description" content="A clear, comfortable way to request your next company flight.">
  <meta property="og:image" content="https://emonson7697.github.io/minnesota-native-flight-operations/public/og.png">
  <link rel="icon" href="public/favicon.svg">
  <link rel="stylesheet" href="premium.css">
</head>
<body>
<header class="site-header">
  <button class="wordmark" onclick="showHome()" aria-label="Minnesota Native Air home">
    <span class="mark">MN</span><span><strong>Minnesota Native</strong><small>Air</small></span>
  </button>
  <nav class="top-nav" aria-label="Primary">
    <button data-view="home" class="active" onclick="showHome()">My trips</button>
    <button data-view="request" onclick="startRequest()">Flight Request</button>
    <button data-view="ops" onclick="showOps()">Operations</button>
  </nav>
  <button class="profile" aria-label="Profile for Joe Schafer">JS</button>
</header>

<main id="app"></main>

<nav class="mobile-nav" aria-label="Mobile navigation">
  <button data-mobile="home" class="active" onclick="showHome()"><span>⌂</span>Trips</button>
  <button data-mobile="request" onclick="startRequest()"><span>＋</span>Request</button>
  <button data-mobile="ops" onclick="showOps()"><span>◫</span>Operations</button>
</nav>
<div id="toast" class="toast" role="status" hidden></div>

<script>
const fleet=[
  {id:'N172MN',type:'Cessna 172S',name:'North Star',seats:3,range:'Regional',accent:'pine'},
  {id:'N612ML',type:'Cessna 172S',name:'Lakes Country',seats:3,range:'Regional',accent:'sky'},
  {id:'N208MN',type:'Kodiak 100',name:'Timberwolf',seats:8,range:'Long-range',accent:'pine'},
  {id:'N44MN',type:'Robinson R44',name:'Canopy',seats:3,range:'Local',accent:'sand'}
];
const profiles=[
  {id:'joe',name:'Joe Schafer',weight:185,detail:'You · fleet owner',selected:true},
  {id:'leah',name:'Leah M.',weight:142,detail:'Frequent traveler',selected:true},
  {id:'jordan',name:'Jordan T.',weight:176,detail:'Frequent traveler',selected:false}
];
let state={step:1,requester:'joe',tripType:'round',returnTbd:false,returnLabel:'Return to Brainerd',stops:['Dallas Love Field (KDAL)'],privateSite:true,departure:'Brainerd Regional (KBRD)',arrival:'Austin-Bergstrom (KAUS)',departDate:'2026-08-24',departTime:'08:00',returnDate:'2026-08-27',returnTime:'15:30',aircraft:'N208MN',gear:90,preferredPilot:'No preference',submitted:false};

function setView(view){document.querySelectorAll('[data-view],[data-mobile]').forEach(b=>b.classList.toggle('active',(b.dataset.view||b.dataset.mobile)===view));window.scrollTo(0,0)}
function toast(message){const t=document.getElementById('toast');t.textContent='✓ '+message;t.hidden=false;setTimeout(()=>t.hidden=true,2600)}
function formatDate(value){if(!value)return 'To be decided';return new Date(value+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function available(a){if(a.id==='N44MN'&&state.departDate<='2026-08-25')return {ok:false,label:'Maintenance through Aug 25'};if(a.id==='N612ML'&&state.departDate==='2026-08-24')return {ok:false,label:'Returns at 4:30 PM'};return {ok:true,label:'Available for your dates'}}

function showHome(){setView('home');document.getElementById('app').innerHTML=`
  <section class="home-shell">
    <div class="home-intro"><p class="eyebrow">Tuesday, August 18</p><h1>Where can we take you?</h1><p>Choose your route, dates, and travelers.</p><button class="primary large" onclick="startRequest()">Flight Request <span>→</span></button></div>
    <section class="current-trip">
      <div class="trip-top"><div><p class="eyebrow">Upcoming request · MN-1048</p><span class="status-pill">Pilot assigned</span></div><button class="text-button" onclick="showStatus(true)">View details →</button></div>
      <div class="route-line"><div><strong>KBRD</strong><span>Brainerd</span></div><div class="route-path"><i></i><span>✈</span><i></i><small>2 hr 48 min</small></div><div class="align-right"><strong>KAUS</strong><span>Austin</span></div></div>
      <div class="trip-summary"><div><small>Depart</small><strong>Mon, Aug 24 · 8:00 AM</strong></div><div><small>Return</small><strong>Thu, Aug 27 · 3:30 PM</strong></div><div><small>Aircraft</small><strong>Kodiak · Timberwolf</strong></div><div class="pilot-chip"><span>MJ</span><p><small>Your pilot</small><strong>Mara Jensen</strong></p></div></div>
      <div class="readiness-strip"><div class="ready"><i>✓</i><p><small>Aircraft</small><strong>Kodiak available</strong></p></div><div class="ready"><i>✓</i><p><small>Pilot</small><strong>Mara confirmed</strong></p></div><div class="pending"><i>3</i><p><small>Landing zone</small><strong>Approval pending</strong></p></div></div>
    </section>
    <p class="support-copy">Plans change? Your operations team is here to help. <button onclick="toast('Operations notified')">Contact operations</button></p>
  </section>`}

function startRequest(){state.step=1;state.submitted=false;renderRequest()}
function renderRequest(){setView('request');if(state.submitted)return renderConfirmation();const labels=['Trip','Aircraft','Travelers','Review'];document.getElementById('app').innerHTML=`
  <section class="request-shell">
    <div class="request-head"><button class="back-link" onclick="showHome()">← My trips</button><p class="eyebrow">Flight request</p><h1>${['Plan your trip','Choose an aircraft','Who is traveling?','Review your request'][state.step-1]}</h1><p>${['Tell us where you need to go.','Availability is matched to your requested dates.','A simple manifest helps the pilot plan safely.','Confirm the details before sending to operations.'][state.step-1]}</p></div>
    <div class="step-bar">${labels.map((l,i)=>`<span class="${state.step>i?'active':''}${state.step===i+1?' current':''}"><i>${state.step>i+1?'✓':i+1}</i><b>${l}</b></span>`).join('')}</div>
    <section class="request-card">${state.step===1?tripStep():state.step===2?aircraftStep():state.step===3?travelerStep():reviewStep()}<div class="form-actions"><button class="secondary" onclick="previous()">${state.step===1?'Save for later':'Back'}</button><button class="primary" onclick="next()">${state.step===4?'Send request':'Continue'} <span>→</span></button></div></section>
    <aside class="reassurance"><span>◎</span><p><strong>This is a request, not a booking.</strong> Operations will confirm that a qualified pilot is available before your trip is finalized.</p></aside>
  </section>`}

function tripStep(){return `<div class="requester-line"><span>Requested by</span><select onchange="state.requester=this.value;renderRequest()"><option value="joe" ${state.requester==='joe'?'selected':''}>Joe Schafer · Owner</option><option value="leah" ${state.requester==='leah'?'selected':''}>Leah M. · Authorized team member</option><option value="jordan" ${state.requester==='jordan'?'selected':''}>Jordan T. · Authorized team member</option></select><small>${state.requester==='joe'?'Owner approval is automatic.':'Joe will approve before operations begins.'}</small></div><div class="field-section"><div class="field-title"><span>01</span><div><h2>Route</h2><p>Choose a company location, airport, or private site.</p></div></div>
  <div class="route-fields"><label><span>Leaving from</span><select onchange="state.departure=this.value"><option>Brainerd Regional (KBRD)</option><option>MNL Brainerd Office</option><option>Bemidji Regional (KBJI)</option><option>Other airport</option></select></label><span class="swap">⇄</span><label><span>Going to</span><select onchange="state.arrival=this.value"><option>Austin-Bergstrom (KAUS)</option><option>MNL Duluth Office</option><option>Dallas Love Field (KDAL)</option><option>Other airport</option></select></label></div>
  <button class="site-toggle ${state.privateSite?'selected':''}" onclick="state.privateSite=!state.privateSite;renderRequest()"><span>${state.privateSite?'✓':'＋'}</span><p><strong>Add a field or private landing zone</strong><small>For a jobsite, nursery, ranch, or other non-airport location</small></p></button>
  ${state.privateSite?`<div class="site-panel"><label><span>Landing zone name or address</span><input value="Red River restoration site" aria-label="Landing zone name or address"></label><div class="notice"><span>i</span><p><strong>We’ll handle permission.</strong> Your operations contractor will contact the location, review suitability, and seek landing approval. The trip is not confirmed until approval is complete.</p></div></div>`:''}</div>
  <div class="field-section"><div class="field-title"><span>02</span><div><h2>Timing</h2><p>One way, return, or multiple stops.</p></div></div><div class="segmented"><button class="${state.tripType==='round'?'active':''}" onclick="state.tripType='round';renderRequest()">Return</button><button class="${state.tripType==='oneway'?'active':''}" onclick="state.tripType='oneway';renderRequest()">One way</button><button class="${state.tripType==='multi'?'active':''}" onclick="state.tripType='multi';renderRequest()">Multi-stop</button></div>
  <div class="date-grid"><label><span>Depart date</span><input type="date" value="${state.departDate}" onchange="state.departDate=this.value;renderRequest()"></label><label><span>Depart time</span><input type="time" value="${state.departTime}" onchange="state.departTime=this.value"></label>${state.tripType!=='oneway'?`<label><span>${state.tripType==='multi'?'Final leg date':'Return date'}</span><input type="date" value="${state.returnDate}" ${state.returnTbd?'disabled':''} onchange="state.returnDate=this.value;renderRequest()"></label><label><span>${state.tripType==='multi'?'Final leg time':'Return time'}</span><input type="time" value="${state.returnTime}" ${state.returnTbd?'disabled':''} onchange="state.returnTime=this.value"></label><label class="return-label"><span>Plan label</span><input value="${state.returnLabel}" onchange="state.returnLabel=this.value" placeholder="e.g. Return to Brainerd"></label><label class="check-row"><input type="checkbox" ${state.returnTbd?'checked':''} onchange="state.returnTbd=this.checked;renderRequest()"> Timing is still TBD</label>`:''}</div><div class="immediate-availability"><span>✓</span><p><strong>${fleet.filter(a=>available(a).ok).length} aircraft show planning availability</strong><small>${state.departDate==='2026-08-24'?'Kodiak Timberwolf and Cessna North Star appear open; nothing is reserved until Joe approves and operations confirms.':'Planning availability updated for '+formatDate(state.departDate)+'; aircraft is not reserved yet.'}</small></p><button onclick="state.step=2;renderRequest()">View aircraft →</button></div>${state.tripType==='multi'?`<div class="stop-list"><p class="eyebrow">Itinerary</p><span><i>1</i><strong>Brainerd</strong><small>Outbound</small></span><span><i>2</i><strong>Austin</strong><small>Primary destination</small></span>${state.stops.map((s,i)=>`<span><i>${i+3}</i><strong>${s}</strong><button onclick="event.stopPropagation();state.stops.splice(${i},1);renderRequest()">×</button></span>`).join('')}<button class="add-stop" onclick="addStop()">＋ Add stop</button></div>`:''}</div>`}

function aircraftStep(){return `<div class="availability-head"><div><p class="eyebrow">Matched to your trip</p><h2>${formatDate(state.departDate)}${state.tripType==='round'?' – '+(state.returnTbd?'Return TBD':formatDate(state.returnDate)):''}</h2></div><button class="text-button" onclick="state.step=1;renderRequest()">Change dates</button></div><div class="aircraft-list">${fleet.map(a=>{const av=available(a);return `<button class="aircraft-choice ${state.aircraft===a.id?'selected':''} ${av.ok?'':'unavailable'}" ${av.ok?'':'disabled'} onclick="state.aircraft='${a.id}';renderRequest()"><span class="aircraft-art ${a.accent}">${a.type.includes('R44')?'✣':a.type.includes('Kodiak')?'➤':'✈'}</span><div><p class="eyebrow">${a.type} · ${a.id}</p><h3>${a.name}</h3><span>${a.seats} passengers · ${a.range}</span></div><p class="availability ${av.ok?'yes':'no'}"><i></i>${av.label}</p><b>${state.aircraft===a.id?'✓':''}</b></button>`}).join('')}</div><div class="weather-note"><span>☀</span><p><strong>Planning outlook · demo data</strong><small>KBRD 68° / light wind → KAUS 91° / scattered clouds · Mon, Aug 24 at 8:00 AM. Operations will verify time-specific weather before departure.</small></p></div>`}

function travelerStep(){const total=profiles.filter(p=>p.selected).reduce((sum,p)=>sum+p.weight,0);return `<div class="weight-summary"><div><small>Estimated passenger weight</small><strong>${total} lb</strong><span>${profiles.filter(p=>p.selected).length} travelers</span></div><div><small>Estimated gear weight</small><strong>${state.gear} lb</strong><span>Tools, samples & bags</span></div></div><div class="manifest-head"><div><p class="eyebrow">Optional convenience</p><h2>Reuse passenger profiles</h2></div><span>${profiles.filter(p=>p.selected).length} selected</span></div><div class="profile-list">${profiles.map(p=>`<button class="profile-row ${p.selected?'selected':''}" onclick="toggleProfile('${p.id}')"><span class="passenger-avatar">${p.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</span><p><strong>${p.name}</strong><small>${p.detail}</small></p><span class="weight"><small>Planning weight</small><strong>${p.weight} lb</strong></span><i>${p.selected?'✓':''}</i></button>`).join('')}</div><button class="add-person" onclick="addTraveler()">＋ Add another traveler</button><div class="manifest-fields"><label><span>Estimated gear weight</span><div class="with-unit"><input type="number" value="${state.gear}" oninput="state.gear=this.value" onchange="renderRequest()"><b>lb</b></div><small>Include samples, tools, and personal bags.</small></label><label><span>Preferred pilot <em>Optional</em></span><select onchange="state.preferredPilot=this.value"><option>No preference</option><option>Mara Jensen</option><option>Eli Redbird</option></select><small>A preference is not a guarantee of pilot availability.</small></label></div><div class="planning-note"><span>◒</span><p><strong>Weight supports safe planning</strong><small>Passenger and gear totals help the assigned pilot plan fuel, balance, and aircraft performance.</small></p></div>`}

function reviewStep(){const chosen=fleet.find(a=>a.id===state.aircraft);const travelers=profiles.filter(p=>p.selected);const total=travelers.reduce((sum,p)=>sum+p.weight,0);return `<div class="review-hero"><span class="aircraft-art pine">➤</span><div><p class="eyebrow">Your requested trip</p><h2>Brainerd → Austin${state.tripType==='multi'?' → Dallas':''}</h2><p>${chosen.type} · ${chosen.name}</p></div><button class="text-button" onclick="state.step=1;renderRequest()">Edit trip</button></div><div class="review-grid"><div><small>Outbound</small><strong>${formatDate(state.departDate)}</strong><span>${state.departTime} · KBRD → KAUS</span></div><div><small>${state.tripType==='multi'?'Final leg':state.tripType==='oneway'?'Trip plan':'Return'}</small><strong>${state.tripType==='oneway'?'One way':state.returnTbd?'Timing TBD':formatDate(state.returnDate)}</strong><span>${state.tripType==='multi'?'KAUS → KDAL · '+state.returnTime:state.returnTbd?'Operations will follow up':state.returnTime+' · '+state.returnLabel}</span></div><div><small>Passenger weight</small><strong>${total} lb</strong><span>${travelers.length} travelers</span></div><div><small>Gear weight</small><strong>${state.gear} lb</strong><span>Planning estimate</span></div></div>${state.privateSite?`<div class="approval-review"><span>⌖</span><p><strong>Private landing zone included</strong><small>Operations will contact Red River restoration site and seek approval before confirming the trip.</small></p></div>`:''}<div class="preference-line"><span>Preferred pilot</span><strong>${state.preferredPilot}</strong></div><label class="confirm-check"><input type="checkbox" checked> Passenger weights and trip details are accurate to the best of my knowledge.</label>`}

function toggleProfile(id){profiles.find(p=>p.id===id).selected=!profiles.find(p=>p.id===id).selected;renderRequest()}
function addStop(){const stop=prompt('Airport, business location, or landing zone');if(!stop)return;state.stops.push(stop);renderRequest();toast('Stop added')}
function addTraveler(){const name=prompt('Traveler name');if(!name)return;const weight=prompt('Planning weight (lb)','170');profiles.push({id:'p'+Date.now(),name,weight:Number(weight)||170,detail:'New traveler',selected:true});renderRequest();toast('Traveler added')}
function previous(){if(state.step===1){toast('Draft saved on this device');showHome()}else{state.step--;renderRequest()}}
function next(){if(state.step<4){state.step++;renderRequest()}else{state.submitted=true;renderRequest();toast('Request sent to operations')}}

function renderConfirmation(){const owner=state.requester==='joe';const requester=owner?'Joe Schafer':state.requester==='leah'?'Leah M.':'Jordan T.';document.getElementById('app').innerHTML=`<section class="confirmation-shell"><div class="confirmation-icon">✓</div><p class="eyebrow">Request MN-1052 · Submitted by ${requester}</p><h1>${owner?'Request sent to operations.':'Sent to Joe for approval.'}</h1><p>${owner?'Owner approval is complete. Operations will now confirm aircraft assignment, primary and backup pilots, and landing clearance when needed.':'After Joe approves, operations will confirm aircraft assignment, primary and backup pilots, and landing clearance when needed.'} Nothing is confirmed yet.</p><div class="confirmation-card"><div><small>Requested route</small><strong>Brainerd → Austin</strong><span>Aug 24 – Aug 27 · Kodiak requested</span></div><button class="primary" onclick="showStatus(false)">View status →</button></div><button class="text-button" onclick="showHome()">Return to my trips</button></section>`}

function showStatus(existing){setView('home');const site=existing||state.privateSite;const owner=existing||state.requester==='joe';document.getElementById('app').innerHTML=`<section class="status-shell"><button class="back-link" onclick="showHome()">← My trips</button><div class="status-head"><div><p class="eyebrow">Request ${existing?'MN-1048':'MN-1052'}</p><h1>${existing?'Two of three trip checks are ready.':owner?'Owner approval complete.':'Awaiting Joe’s approval.'}</h1><p>${existing?'Mara is assigned; landing-zone approval is still in progress.':owner?'Joe submitted this request, so operations can begin its review.':'Operations begins only after Joe approves this team request.'}</p></div><span class="status-pill">${existing?'Pilot assigned':owner?'Owner approved':'Requested'}</span></div><div class="status-route"><div><small>Route</small><strong>Brainerd → Austin</strong></div><div><small>Dates</small><strong>Aug 24 – Aug 27</strong></div><div><small>Aircraft requested</small><strong>Kodiak · Timberwolf</strong></div></div><div class="readiness-grid"><div class="${existing?'ready':'planning'}"><i>${existing?'✓':'1'}</i><p><small>Aircraft</small><strong>${existing?'Kodiak assigned':'Planning availability found'}</strong><span>${existing?'Confirmed by operations':'Not reserved or assigned yet'}</span></p></div><div class="${existing?'ready':'pending'}"><i>${existing?'✓':'2'}</i><p><small>Primary & backup pilots</small><strong>${existing?'Mara + backup confirmed':'Not yet confirmed'}</strong><span>${existing?'Assigned by operations':owner?'Operations review can begin':'Starts after Joe approves'}</span></p></div>${site?`<div class="pending"><i>3</i><p><small>Landing zone</small><strong>Not yet confirmed</strong><span>${owner?'Operations clearance pending':'Starts after Joe approves'}</span></p></div>`:''}</div>${existing?`<section class="pilot-advisory"><div class="pilot-advisory-head"><span class="pilot-badge">MJ</span><div><p class="eyebrow">Pilot trip review</p><h2>Mara Jensen · planning advisory</h2></div><b>Demo planning data</b></div><div class="advisory-grid"><div><small>Planned departure</small><strong>8:10 AM</strong><span>Outbound · KBRD</span></div><div><small>Predicted winds</small><strong>210° at 8 kt</strong><span>Illustrative, not a forecast</span></div><div><small>Airborne time</small><strong>1.5 hours</strong><span>Estimated first leg</span></div><div><small>Destination note</small><strong>Use KAUS Signature</strong><span>Private site remains pending</span></div></div></section>`:''}<div class="friendly-timeline"><div class="complete"><i>✓</i><p><strong>Requested</strong><small>Received ${existing?'Aug 16 at 10:42 AM':'just now'}</small></p></div><div class="${owner?'complete':'current'}"><i>${owner?'✓':'2'}</i><p><strong>Owner approval</strong><small>${existing?'Approved by Joe Schafer':owner?'Implicit · submitted by Joe Schafer':'Waiting for Joe Schafer'}</small></p></div><div class="${existing?'complete':owner?'current':''}"><i>${existing?'✓':'3'}</i><p><strong>${existing?'Pilots assigned':'Operations review'}</strong><small>${existing?'Mara Jensen primary · qualified backup confirmed':owner?'Confirming aircraft, primary pilot, and backup pilot':'Begins only after Joe approves'}</small></p>${existing?'<span class="pilot-badge">MJ</span>':''}</div>${site?`<div class="${existing?'current':''}"><i>4</i><p><strong>Landing approval</strong><small>${existing?'Operations contacted the site · awaiting approval':owner?'May complete before or after pilot assignment':'Begins only after Joe approves'}</small></p></div>`:''}<div><i>${site?'5':'4'}</i><p><strong>Confirmed</strong><small>All required checks are ready</small></p></div></div><aside class="status-help"><span>i</span><p><strong>${owner?'Operations is cleared to plan.':'Joe approval is the gate.'}</strong><small>${owner?'After owner approval, aircraft, pilot, backup pilot, and landing-zone confirmations may complete in different orders.':'No operational assignment or landing-zone work begins until Joe approves.'}</small></p><button onclick="toast('Operations notified')">Contact operations</button></aside></section>`}

function showOps(){setView('ops');document.getElementById('app').innerHTML=`<section class="ops-shell"><div class="ops-head"><div><p class="eyebrow">Back office · demo</p><h1>Aircraft availability</h1><p>Block existing schedules and maintenance, then open a trip for pilot planning.</p></div><button class="secondary" onclick="toast('Schedule block added')">＋ Block time</button></div><div class="calendar"><div class="calendar-head"><span>Aircraft</span>${['Mon 24','Tue 25','Wed 26','Thu 27','Fri 28'].map(d=>`<span>${d}</span>`).join('')}</div>${fleet.map((a,i)=>`<div class="calendar-row"><span><strong>${a.name}</strong><small>${a.id}</small></span>${[0,1,2,3,4].map(day=>{let cls='',txt='Available';if(a.id==='N208MN'&&day<4){cls='trip-block';txt=day===0?'MN-1048':'Austin trip'}if(a.id==='N44MN'&&day<2){cls='maint-block';txt='Maintenance'}if(a.id==='N612ML'&&day===0){cls='trip-block';txt='Until 4:30'}return `<button class="${cls}" onclick="${cls==='trip-block'&&a.id==='N208MN'?`showPilotTrip()`:`toast('${a.name}: ${txt}')`}">${txt}</button>`}).join('')}</div>`).join('')}</div><p class="ops-footnote">Demo scheduling only. Flight Schedule Pro remains a future operational source of truth and is not connected.</p></section>`}

function showPilotTrip(){document.getElementById('app').innerHTML=`<section class="pilot-trip"><button class="back-link" onclick="showOps()">← Aircraft availability</button><div class="pilot-trip-head"><div><p class="eyebrow">Pilot planning · MN-1048</p><h1>Brainerd → Austin</h1><p>Kodiak N208MN · Aug 24–27</p></div><span class="status-pill">Assigned to Mara</span></div><div class="pilot-columns"><section><h2>Passenger manifest</h2>${profiles.filter(p=>p.selected).map(p=>`<div class="pilot-person"><span>${p.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</span><p><strong>${p.name}</strong><small>${p.detail}</small></p><b>${p.weight} lb</b></div>`).join('')}<div class="manifest-total"><span>Passenger total</span><strong>${profiles.filter(p=>p.selected).reduce((a,p)=>a+p.weight,0)} lb</strong></div><div class="manifest-total"><span>Gear & baggage</span><strong>90 lb</strong></div></section><section><h2>Trip notes</h2><div class="pilot-fact"><small>Private site</small><strong>Red River restoration site</strong><span>Approval pending · operations contacting owner</span></div><div class="pilot-fact"><small>Ground transport</small><strong>Vehicle requested on arrival</strong></div><div class="pilot-fact"><small>Purpose</small><strong>Field leadership and project review</strong></div></section></div></section>`}

showHome();
</script>
</body>
</html>
